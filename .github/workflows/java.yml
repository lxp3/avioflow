name: Release Java

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build Java main jar
        run: gradle -p java clean jar sourcesJar mavenPlainJavadocJar

      - uses: actions/upload-artifact@v4
        with:
          name: java-main
          path: java/build/libs/*.jar

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            runner: ubuntu-latest
            os: unix
            target_arch: ''
            skip_tests: '0'
          - classifier: linux-aarch64
            runner: ubuntu-24.04-arm
            os: unix
            target_arch: ''
            skip_tests: '0'
          - classifier: macos-x86_64
            runner: macos-15-intel
            os: unix
            target_arch: ''
            skip_tests: '0'
          - classifier: macos-aarch64
            runner: macos-15
            os: unix
            target_arch: ''
            skip_tests: '0'
          - classifier: windows-x86_64
            runner: windows-latest
            os: windows
            target_arch: x64
            skip_tests: '0'
          - classifier: windows-aarch64
            runner: windows-latest
            os: windows
            target_arch: arm64
            skip_tests: '1'
    runs-on: ${{ matrix.runner }}
    container: ${{ startsWith(matrix.classifier, 'linux-x86_64') && 'quay.io/pypa/manylinux_2_28_x86_64' || startsWith(matrix.classifier, 'linux-aarch64') && 'quay.io/pypa/manylinux_2_28_aarch64' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build native classifier
        if: matrix.os == 'unix'
        shell: bash
        env:
          AVIOFLOW_SKIP_TESTS: ${{ matrix.skip_tests }}
          CLASSIFIER: ${{ matrix.classifier }}
        run: |
          set -euo pipefail
          cmake -S . -B build-java \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_WASAPI=OFF \
            -DENABLE_PYTHON=OFF \
            -DENABLE_NODE_JS=OFF \
            -DENABLE_JAVA=ON \
            -DENABLE_BINARY=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build-java --config Release -j "$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"

          NATIVE_DIR="java/build/native/$CLASSIFIER"
          mkdir -p "$NATIVE_DIR"
          cp build-java/bin/libavioflow_jni.so "$NATIVE_DIR/" 2>/dev/null || \
          cp build-java/bin/libavioflow_jni.dylib "$NATIVE_DIR/"

          GRADLE_TASKS=(test nativeJar)
          if [ "$AVIOFLOW_SKIP_TESTS" = "1" ]; then
            GRADLE_TASKS=(nativeJar)
          fi
          gradle -p java \
            -Pavioflow.nativeClassifier="$CLASSIFIER" \
            -Pavioflow.nativeLibraryDir="$PWD/$NATIVE_DIR" \
            "${GRADLE_TASKS[@]}"

      - name: Check Linux glibc baseline
        if: startsWith(matrix.classifier, 'linux-')
        run: scripts/check_glibc_version.sh java/build/native/${{ matrix.classifier }}/*.so

      - name: Build native classifier
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          AVIOFLOW_SKIP_TESTS: ${{ matrix.skip_tests }}
        run: |
          $ErrorActionPreference = "Stop"
          $Classifier = "${{ matrix.classifier }}"
          $Platform = if ("${{ matrix.target_arch }}" -eq "arm64") { "ARM64" } else { "x64" }

          cmake -S . -B build-java `
            -A $Platform `
            -DBUILD_SHARED_LIBS=OFF `
            -DENABLE_WASAPI=ON `
            -DENABLE_PYTHON=OFF `
            -DENABLE_NODE_JS=OFF `
            -DENABLE_JAVA=ON `
            -DENABLE_BINARY=OFF `
            -DBUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build build-java --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $NativeDir = Join-Path $PWD "java/build/native/$Classifier"
          New-Item -ItemType Directory -Force -Path $NativeDir | Out-Null

          $Dll = "build-java/bin/Release/avioflow_jni.dll"
          if (-not (Test-Path $Dll)) { $Dll = "build-java/bin/avioflow_jni.dll" }
          Copy-Item $Dll $NativeDir

          $GradleTasks = if ($env:AVIOFLOW_SKIP_TESTS -eq "1") { @("nativeJar") } else { @("test", "nativeJar") }
          gradle -p java `
            "-Pavioflow.nativeClassifier=$Classifier" `
            "-Pavioflow.nativeLibraryDir=$NativeDir" `
            $GradleTasks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.classifier }}
          path: |
            java/build/native/${{ matrix.classifier }}/
            java/build/libs/*-${{ matrix.classifier }}.jar

  publish:
    needs:
      - build-main
      - build-native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: java/build/native-downloads
          merge-multiple: true

      - name: Collect native libraries
        run: |
          mkdir -p java/build/native
          for classifier in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64; do
            mkdir -p "java/build/native/$classifier"
            find java/build/native-downloads -path "*/$classifier/*" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} "java/build/native/$classifier/" \;
            test -n "$(find "java/build/native/$classifier" -type f)"
          done

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_PASSPHRASE }}
        run: gradle -p java publishAndReleaseToMavenCentral --no-configuration-cache
