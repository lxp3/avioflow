name: Java

on:
  pull_request:
    paths:
      - 'java/**'
      - 'avioflow/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'build-java.*'
      - 'scripts/sync_version.py'
      - '.github/workflows/java.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build Java main jar
        run: gradle -p java clean jar sourcesJar javadocJar

      - uses: actions/upload-artifact@v4
        with:
          name: java-main
          path: java/build/libs/*.jar

  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            runner: ubuntu-latest
            shell: bash
            command: ./build-java.sh linux-x86_64
            skip-tests: '0'
          - classifier: linux-aarch64
            runner: ubuntu-24.04-arm
            shell: bash
            command: ./build-java.sh linux-aarch64
            skip-tests: '0'
          - classifier: macos-x86_64
            runner: macos-15-intel
            shell: bash
            command: ./build-java.sh macos-x86_64
            skip-tests: '0'
          - classifier: macos-aarch64
            runner: macos-15
            shell: bash
            command: ./build-java.sh macos-aarch64
            skip-tests: '0'
          - classifier: windows-x86_64
            runner: windows-latest
            shell: pwsh
            command: ./build-java.ps1 -Classifier windows-x86_64 -TargetArch x64
            skip-tests: '0'
          - classifier: windows-aarch64
            runner: windows-latest
            shell: pwsh
            command: ./build-java.ps1 -Classifier windows-aarch64 -TargetArch arm64
            skip-tests: '1'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build native classifier
        shell: ${{ matrix.shell }}
        env:
          AVIOFLOW_SKIP_TESTS: ${{ matrix.skip-tests }}
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.classifier }}
          path: |
            java/build/native/${{ matrix.classifier }}/
            java/build/libs/*-${{ matrix.classifier }}.jar

  publish:
    needs:
      - build-main
      - build-native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: java/build/native-downloads
          merge-multiple: true

      - name: Collect native libraries
        run: |
          mkdir -p java/build/native
          for classifier in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64; do
            mkdir -p "java/build/native/$classifier"
            find java/build/native-downloads -path "*/$classifier/*" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} "java/build/native/$classifier/" \;
            test -n "$(find "java/build/native/$classifier" -type f)"
          done

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_PASSPHRASE }}
        run: gradle -p java publishAndReleaseToMavenCentral --no-configuration-cache
