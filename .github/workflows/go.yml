name: Go

on:
  # Release tags reach this through release.yml, which calls it via workflow_call
  # once the tag dispatcher decides this language is in scope. Triggering on tags
  # here as well would run the whole job twice for every release.
  workflow_call:
  pull_request:
    paths:
      - 'go/**'
      - 'avioflow/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/go.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false

      # cgo cannot compile the C++ core during `go build`, unlike the Rust crate's
      # build.rs, so the native library has to be installed first. Static, so the
      # test binaries need no library path at runtime.
      - name: Build and install the native library
        run: |
          set -euo pipefail
          cmake -S . -B build-go \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DENABLE_BINARY=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/build-go/prefix"
          cmake --build build-go --config Release -j "$(nproc)"
          cmake --install build-go

      - name: Verify pkg-config metadata
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$PWD/build-go/prefix/lib/pkgconfig"
          pkg-config --exists avioflow
          echo "version: $(pkg-config --modversion avioflow)"
          echo "cflags : $(pkg-config --cflags avioflow)"
          echo "libs   : $(pkg-config --libs avioflow)"

      - name: Check formatting
        working-directory: go
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat: $unformatted"
            exit 1
          fi

      - name: Build
        working-directory: go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build-go/prefix/lib/pkgconfig
        run: go build ./...

      - name: Vet
        working-directory: go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build-go/prefix/lib/pkgconfig
        run: go vet ./...

      - name: Test
        working-directory: go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build-go/prefix/lib/pkgconfig
        run: go test -count=1 ./...

      # The strict check catches Go pointers written into C memory, which the
      # default checks miss and which corrupt memory only intermittently at
      # runtime. Go 1.21 moved it from the runtime GODEBUG=cgocheck=2 to a
      # build-time experiment, and on 1.21+ the old form is a fatal error.
      - name: Test with strict cgo pointer checks
        working-directory: go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build-go/prefix/lib/pkgconfig
          GOEXPERIMENT: cgocheck2
        run: go test -count=1 ./...

      - name: Test with the race detector
        working-directory: go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/build-go/prefix/lib/pkgconfig
        run: go test -race -count=1 ./...
