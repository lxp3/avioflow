name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for provenance
  actions: write # Required for cancelling other jobs

jobs:
  # ============================================================
  # Determine what to build based on tag
  # Tag formats:
  #   v0.1.5       -> Build and publish everything (C++, Python, npm)
  #   v0.1.5-cpp   -> Build and publish C++ only
  #   v0.1.5-wheels -> Build and publish Python wheels only
  #   v0.1.5-npm   -> Build and publish npm only
  #   v0.1.5-vsix  -> Build and publish VS Code extension only
  # ============================================================
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      build-cpp: ${{ steps.check.outputs.build-cpp }}
      build-python: ${{ steps.check.outputs.build-python }}
      build-npm: ${{ steps.check.outputs.build-npm }}
      build-vsix: ${{ steps.check.outputs.build-vsix }}
      tag-name: ${{ steps.check.outputs.tag-name }}
    steps:
      - name: Check tag format
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag-name=$TAG" >> $GITHUB_OUTPUT
          
          # Default: build nothing
          BUILD_CPP="false"
          BUILD_PYTHON="false"
          BUILD_NPM="false"
          BUILD_VSIX="false"
          
          # Check tag suffix
          if [[ "$TAG" =~ -cpp$ ]]; then
            echo "Tag ends with -cpp: Building C++ only"
            BUILD_CPP="true"
          elif [[ "$TAG" =~ -wheels$ ]]; then
            echo "Tag ends with -wheels: Building Python wheels only"
            BUILD_PYTHON="true"
          elif [[ "$TAG" =~ -npm$ ]]; then
            echo "Tag ends with -npm: Building npm only"
            BUILD_NPM="true"
          elif [[ "$TAG" =~ -vsix$ ]]; then
            echo "Tag ends with -vsix: Building VS Code extension only"
            BUILD_VSIX="true"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag is version only: Building everything"
            BUILD_CPP="true"
            BUILD_PYTHON="true"
            BUILD_NPM="true"
          else
            echo "Unknown tag format: $TAG"
            echo "Supported formats: v0.1.5, v0.1.5-cpp, v0.1.5-wheels, v0.1.5-npm, v0.1.5-vsix"
            exit 1
          fi
          
          echo "build-cpp=$BUILD_CPP" >> $GITHUB_OUTPUT
          echo "build-python=$BUILD_PYTHON" >> $GITHUB_OUTPUT
          echo "build-npm=$BUILD_NPM" >> $GITHUB_OUTPUT
          echo "build-vsix=$BUILD_VSIX" >> $GITHUB_OUTPUT
          
          echo "Build configuration:"
          echo "  C++: $BUILD_CPP"
          echo "  Python: $BUILD_PYTHON"
          echo "  npm: $BUILD_NPM"
          echo "  VS Code Extension: $BUILD_VSIX"

  # ============================================================
  # Linux Build (C++ + Node.js + Python Wheels)
  # ============================================================
  build-linux:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-npm == 'true'
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache System Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: /var/cache/yum
          key: linux-deps-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Install System Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          yum install -y epel-release
          yum install -y alsa-lib-devel libX11-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel

      - name: Install Node.js 20
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          yum install -y nodejs

      # --- Build C++ Shared Binaries (Only if build-cpp is true) ---
      - name: Build C++ Shared Binaries
        if: needs.check-tag.outputs.build-cpp == 'true'
        run: |
          cmake -B build_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_WASAPI=OFF \
            -DENABLE_PYTHON=OFF \
            -DENABLE_NODE_JS=OFF \
            -DENABLE_BINARY=ON
          cmake --build build_shared --config Release -j $(nproc)

      - name: Package C++ Binaries
        if: needs.check-tag.outputs.build-cpp == 'true'
        run: |
          PKG_DIR="avioflow-shared-linux-x64"
          cmake --install build_shared --prefix $PKG_DIR
          tar -czvf $PKG_DIR.tar.gz $PKG_DIR

      # --- Build Node.js Addon (Static, Node-API 8 for Node.js >= 16) ---
      - name: Build Node.js Addon (Node-API 8)
        if: needs.check-tag.outputs.build-npm == 'true'
        run: |
          npm install
          
          # Build with cmake-js for Node.js (no Electron support)
          echo "Building Node-API 8 addon for Node.js..."
          npx cmake-js compile --CDCMAKE_BUILD_TYPE=Release --CDNAPI_VERSION=8
          
          # Create prebuilds directory
          mkdir -p prebuilds/linux-x64
          cp build/bin/avioflow.node prebuilds/linux-x64/avioflow.napi.node
          
          echo "=== Prebuild Info ==="
          echo "Node-API version: 8"
          echo "Compatible with: Node.js 16+"
          echo "Prebuilds created:"
          ls -la prebuilds/linux-x64/

      # Verify the built module works
      - name: Verify Node.js Addon
        if: needs.check-tag.outputs.build-npm == 'true'
        run: |
          echo "Verifying native module loads correctly..."
          node -e "const m = require('./prebuilds/linux-x64/avioflow.napi.node'); console.log('Exports:', Object.keys(m));"
          node tests/nodejs/test-local.js
          echo "Verification passed!"

      # --- Upload Artifacts ---
      - uses: actions/upload-artifact@v4
        if: needs.check-tag.outputs.build-cpp == 'true'
        with:
          name: linux-cpp-binaries
          path: avioflow-shared-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        if: needs.check-tag.outputs.build-npm == 'true'
        with:
          name: linux-nodejs-prebuilds
          path: prebuilds/

      - name: Cancel workflow on failure
        if: failure()
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Build Python Wheels (Linux, Shared) ---
  build-python-linux:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD_LINUX: >
            yum install -y epel-release &&
            yum install -y alsa-lib-devel libX11-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel
          CIBW_ENVIRONMENT_LINUX: "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(find /project -name "libavformat.so*" -exec dirname {} \; | head -n 1) &&
            auditwheel repair -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/tests/python/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-python-wheels
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Windows Build (C++ + Node.js + Python Wheels)
  # ============================================================
  build-windows:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-npm == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Build C++ Shared Binaries (Only if build-cpp is true) ---
      - name: Build C++ Shared Binaries
        if: needs.check-tag.outputs.build-cpp == 'true'
        shell: pwsh
        run: |
          cmake -B build_shared `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DENABLE_WASAPI=ON `
            -DENABLE_PYTHON=OFF `
            -DENABLE_NODE_JS=OFF `
            -DENABLE_BINARY=ON
          cmake --build build_shared --config Release -j 4

      - name: Package C++ Binaries
        if: needs.check-tag.outputs.build-cpp == 'true'
        shell: pwsh
        run: |
          $PkgDir = "avioflow-shared-win-x64"
          cmake --install build_shared --prefix $PkgDir --config Release
          Compress-Archive -Path "$PkgDir/*" -DestinationPath "$PkgDir.zip"

      # --- Build Node.js Addon (Static, Node-API 8 for Node.js >= 16) ---
      - name: Build Node.js Addon (Node-API 8)
        if: needs.check-tag.outputs.build-npm == 'true'
        shell: pwsh
        run: |
          npm install
          
          # Build with cmake-js for Node.js (no Electron support)
          Write-Host "Building Node-API 8 addon for Node.js..."
          npx cmake-js compile --CDNAPI_VERSION=8
          
          # Create prebuilds directory
          New-Item -ItemType Directory -Path prebuilds/win32-x64 -Force
          Copy-Item build/bin/Release/avioflow.node prebuilds/win32-x64/avioflow.napi.node
          
          Write-Host "=== Prebuild Info ==="
          Write-Host "Node-API version: 8"
          Write-Host "Compatible with: Node.js 16+"
          Write-Host "Prebuilds created:"
          Get-ChildItem -Recurse prebuilds/

      # Verify the built module works
      - name: Verify Node.js Addon
        if: needs.check-tag.outputs.build-npm == 'true'
        shell: pwsh
        run: |
          Write-Host "Verifying native module loads correctly..."
          node -e "const m = require('./prebuilds/win32-x64/avioflow.napi.node'); console.log('Exports:', Object.keys(m));"
          node tests/nodejs/test-local.js
          Write-Host "Verification passed!"

      # --- Upload Artifacts ---
      - uses: actions/upload-artifact@v4
        if: needs.check-tag.outputs.build-cpp == 'true'
        with:
          name: windows-cpp-binaries
          path: avioflow-shared-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: needs.check-tag.outputs.build-npm == 'true'
        with:
          name: windows-nodejs-prebuilds
          path: prebuilds/

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Build Python Wheels (Windows, Shared) ---
  build-python-windows:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-win32"
          CIBW_ENVIRONMENT_WINDOWS: "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/tests/python/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-python-wheels
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Build VS Code Extension (.vsix)
  # ============================================================
  build-vsix:
    needs: check-tag
    if: needs.check-tag.outputs.build-vsix == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build VS Code Extension
        shell: pwsh
        working-directory: vscode-extension
        run: |
          Write-Host ">>> Step 1: Installing dependencies..." -ForegroundColor Cyan
          pnpm install
          
          Write-Host ">>> Step 2: Cleaning up previous builds..." -ForegroundColor Cyan
          if (Test-Path "out") { Remove-Item -Recurse -Force "out" }
          if (Test-Path "*.vsix") { Remove-Item -Force "*.vsix" }
          
          Write-Host ">>> Step 3: Compiling extension..." -ForegroundColor Cyan
          pnpm run compile
          
          Write-Host ">>> Step 4: Copying native modules..." -ForegroundColor Cyan
          if (!(Test-Path "out/node_modules")) { New-Item -ItemType Directory -Path "out/node_modules" }
          Copy-Item -Recurse -Force "node_modules/avioflow" "out/node_modules/"
          
          Write-Host ">>> Step 5: Packaging .vsix..." -ForegroundColor Cyan
          # Extract version from tag
          $tag = "${{ needs.check-tag.outputs.tag-name }}"
          $version = $tag -replace '^v' -replace '-vsix$'
          npx -y @vscode/vsce package --no-dependencies --allow-missing-repository -o "avioflow-$version.vsix"
          
          Write-Host ">>> Build complete!" -ForegroundColor Green
          Get-ChildItem *.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Publish to GitHub, PyPI, NPM, and VS Code Marketplace
  # ============================================================
  publish:
    needs: [check-tag, build-linux, build-python-linux, build-windows, build-python-windows, build-vsix]
    runs-on: ubuntu-latest
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.check-tag.result == 'success') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-python-linux.result == 'success' || needs.build-python-linux.result == 'skipped') &&
      (needs.build-python-windows.result == 'success' || needs.build-python-windows.result == 'skipped') &&
      (needs.build-vsix.result == 'success' || needs.build-vsix.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.check-tag.outputs.build-npm == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Download all artifacts
      - uses: actions/download-artifact@v4
        continue-on-error: true # Not all tags produce all artifacts
        with:
          path: artifacts

      # Prepare directories
      - name: Prepare release files
        run: |
          mkdir -p dist pypi_dist prebuilds vsix_dist
          
          # C++ binaries (GitHub Release only)
          if [ "${{ needs.check-tag.outputs.build-cpp }}" == "true" ]; then
            echo "Preparing C++ binaries..."
            cp artifacts/linux-cpp-binaries/* dist/ || true
            cp artifacts/windows-cpp-binaries/* dist/ || true
          fi
          
          # Python wheels (GitHub Release & PyPI)
          if [ "${{ needs.check-tag.outputs.build-python }}" == "true" ]; then
            echo "Preparing Python wheels..."
            cp artifacts/linux-python-wheels/*.whl dist/ || true
            cp artifacts/windows-python-wheels/*.whl dist/ || true
            cp artifacts/linux-python-wheels/*.whl pypi_dist/ || true
            cp artifacts/windows-python-wheels/*.whl pypi_dist/ || true
          fi
          
          # Node.js prebuilds
          if [ "${{ needs.check-tag.outputs.build-npm }}" == "true" ]; then
            echo "Preparing npm prebuilds..."
            cp -r artifacts/linux-nodejs-prebuilds/* prebuilds/ || true
            cp -r artifacts/windows-nodejs-prebuilds/* prebuilds/ || true
          fi
          
          # VS Code extension
          if [ "${{ needs.check-tag.outputs.build-vsix }}" == "true" ]; then
            echo "Preparing VS Code extension..."
            cp artifacts/vscode-extension/*.vsix vsix_dist/ || true
            cp artifacts/vscode-extension/*.vsix dist/ || true
          fi
          
          echo "Release contents:"
          ls -la dist/ || true
          ls -la pypi_dist/ || true
          ls -la prebuilds/ || true
          ls -la vsix_dist/ || true

      # Upload to GitHub Release
      - name: Upload to GitHub Release
        if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-python == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - name: Publish to PyPI
        if: needs.check-tag.outputs.build-python == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi_dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to NPM
        if: needs.check-tag.outputs.build-npm == 'true'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists on NPM. Skipping publish."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish to VS Code Marketplace
      - name: Publish to VS Code Marketplace
        if: needs.check-tag.outputs.build-vsix == 'true'
        run: |
          VSIX_FILE=$(ls vsix_dist/*.vsix | head -n 1)
          echo "Publishing $VSIX_FILE to VS Code Marketplace..."
          npx -y @vscode/vsce publish --packagePath "$VSIX_FILE"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
