name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag or build selector, for example v0.3.4 or v0.3.4-linux-cpp'
        required: true
        default: 'v0.3.4'

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      build-cpp: ${{ steps.check.outputs.build-cpp }}
      build-python: ${{ steps.check.outputs.build-python }}
      build-npm: ${{ steps.check.outputs.build-npm }}
      build-wasm: ${{ steps.check.outputs.build-wasm }}
      build-vsix: ${{ steps.check.outputs.build-vsix }}
      build-java: ${{ steps.check.outputs.build-java }}
      python-target: ${{ steps.check.outputs.python-target }}
      cpp-target: ${{ steps.check.outputs.cpp-target }}
      tag-name: ${{ steps.check.outputs.tag-name }}
    steps:
      - name: Check tag format
        id: check
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag-name=$TAG" >> $GITHUB_OUTPUT
          
          # Default: build nothing
          BUILD_CPP="false"
          BUILD_PYTHON="false"
          BUILD_NPM="false"
          BUILD_WASM="false"
          BUILD_VSIX="false"
          BUILD_JAVA="false"
          PYTHON_TARGET="all"
          CPP_TARGET="all"
          
          # Check tag suffix
          if [[ "$TAG" =~ -linux-cpp$ ]]; then
            echo "Tag ends with -linux-cpp: Building Linux C++ only"
            BUILD_CPP="true"
            CPP_TARGET="linux"
          elif [[ "$TAG" =~ -cpp$ ]]; then
            echo "Tag ends with -cpp: Building C++ only"
            BUILD_CPP="true"
          elif [[ "$TAG" =~ -py-linux$ ]]; then
            echo "Tag ends with -py-linux: Building Linux Python wheels only"
            BUILD_PYTHON="true"
            PYTHON_TARGET="linux"
          elif [[ "$TAG" =~ -py$ ]]; then
            echo "Tag ends with -py: Building Python wheels only"
            BUILD_PYTHON="true"
          elif [[ "$TAG" =~ -npm$ ]]; then
            echo "Tag ends with -npm: Building npm only"
            BUILD_NPM="true"
          elif [[ "$TAG" =~ -vsix$ ]]; then
            echo "Tag ends with -vsix: Building VS Code extension only"
            BUILD_VSIX="true"
          elif [[ "$TAG" =~ -java$ ]]; then
            echo "Tag ends with -java: Building Java only"
            BUILD_JAVA="true"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag is version only: Building everything"
            BUILD_CPP="true"
            BUILD_PYTHON="true"
            BUILD_NPM="true"
            BUILD_JAVA="true"
          else
            echo "Unknown tag format: $TAG"
            echo "Supported formats: v0.1.5, v0.1.5-cpp, v0.1.5-linux-cpp, v0.1.5-py, v0.1.5-py-linux, v0.1.5-npm, v0.1.5-vsix, v0.1.5-java"
            exit 1
          fi
          
          echo "build-cpp=$BUILD_CPP" >> $GITHUB_OUTPUT
          echo "build-python=$BUILD_PYTHON" >> $GITHUB_OUTPUT
          echo "build-npm=$BUILD_NPM" >> $GITHUB_OUTPUT
          echo "build-wasm=$BUILD_WASM" >> $GITHUB_OUTPUT
          echo "build-vsix=$BUILD_VSIX" >> $GITHUB_OUTPUT
          echo "build-java=$BUILD_JAVA" >> $GITHUB_OUTPUT
          echo "python-target=$PYTHON_TARGET" >> $GITHUB_OUTPUT
          echo "cpp-target=$CPP_TARGET" >> $GITHUB_OUTPUT
          
          echo "Build configuration:"
          echo "  C++: $BUILD_CPP"
          echo "  Python: $BUILD_PYTHON"
          echo "  npm: $BUILD_NPM"
          echo "  C++ target: $CPP_TARGET"
          echo "  Python target: $PYTHON_TARGET"
          echo "  VS Code Extension: $BUILD_VSIX"
          echo "  Java: $BUILD_JAVA"

  cpp:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true'
    uses: ./.github/workflows/cpp.yml
    with:
      build-cpp: ${{ needs.check-tag.outputs.build-cpp == 'true' }}
      cpp-target: ${{ needs.check-tag.outputs.cpp-target }}
    secrets: inherit

  node:
    needs: check-tag
    if: needs.check-tag.outputs.build-npm == 'true'
    uses: ./.github/workflows/node.yml
    with:
      build-npm: ${{ needs.check-tag.outputs.build-npm == 'true' }}
    secrets: inherit

  windows:
    needs: check-tag
    if: (needs.check-tag.outputs.build-cpp == 'true' && needs.check-tag.outputs.cpp-target == 'all') || needs.check-tag.outputs.build-npm == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      build-cpp: ${{ needs.check-tag.outputs.build-cpp == 'true' }}
      build-npm: ${{ needs.check-tag.outputs.build-npm == 'true' }}
    secrets: inherit

  python:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true'
    uses: ./.github/workflows/python.yml
    with:
      build-python: ${{ needs.check-tag.outputs.build-python == 'true' }}
      python-target: ${{ needs.check-tag.outputs.python-target }}
    secrets: inherit

  java:
    needs: check-tag
    if: needs.check-tag.outputs.build-java == 'true'
    uses: ./.github/workflows/java.yml
    secrets: inherit

  wasm:
    needs: check-tag
    if: needs.check-tag.outputs.build-wasm == 'true'
    uses: ./.github/workflows/wasm.yml
    with:
      build-wasm: ${{ needs.check-tag.outputs.build-wasm == 'true' }}
      tag-name: ${{ needs.check-tag.outputs.tag-name }}
    secrets: inherit

  vsix:
    needs: check-tag
    if: needs.check-tag.outputs.build-vsix == 'true'
    uses: ./.github/workflows/vsix.yml
    with:
      build-vsix: ${{ needs.check-tag.outputs.build-vsix == 'true' }}
    secrets: inherit

  publish:
    needs: [check-tag, cpp, node, windows, python, java, wasm, vsix]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (needs.check-tag.result == 'success') &&
      (needs.cpp.result == 'success' || needs.cpp.result == 'skipped') &&
      (needs.node.result == 'success' || needs.node.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.java.result == 'success' || needs.java.result == 'skipped') &&
      (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') &&
      (needs.vsix.result == 'success' || needs.vsix.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: needs.check-tag.outputs.build-npm == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: needs.check-tag.outputs.build-npm == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Download all artifacts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Prepare directories
      - name: Prepare release files
        run: |
          shopt -s nullglob
          mkdir -p dist pypi_dist vsix_dist
          require_glob() {
            local description="$1"
            shift
            local matches=("$@")
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "Missing required artifact: $description"
              exit 1
            fi
          }

          # C++ binaries
          if [ "${{ needs.check-tag.outputs.build-cpp }}" == "true" ]; then
            require_glob "Linux shared x86_64 C++ ABI 0 package" artifacts/linux-cpp-binaries-shared-x86_64-abi0/*.tar.gz
            require_glob "Linux static x86_64 C++ ABI 0 package" artifacts/linux-cpp-binaries-static-x86_64-abi0/*.tar.gz
            require_glob "Linux shared arm64 C++ ABI 0 package" artifacts/linux-cpp-binaries-shared-aarch64-abi0/*.tar.gz
            require_glob "Linux static arm64 C++ ABI 0 package" artifacts/linux-cpp-binaries-static-aarch64-abi0/*.tar.gz
            if [ "${{ needs.check-tag.outputs.cpp-target }}" == "all" ]; then
              require_glob "macOS shared x86_64 C++ package" artifacts/macos-cpp-binaries-shared-x86_64/*.tar.gz
              require_glob "macOS static x86_64 C++ package" artifacts/macos-cpp-binaries-static-x86_64/*.tar.gz
              require_glob "macOS shared arm64 C++ package" artifacts/macos-cpp-binaries-shared-aarch64/*.tar.gz
              require_glob "macOS static arm64 C++ package" artifacts/macos-cpp-binaries-static-aarch64/*.tar.gz
              require_glob "Windows shared x64 C++ package" artifacts/windows-cpp-binaries-shared-x64/*.zip
              require_glob "Windows static x64 C++ package" artifacts/windows-cpp-binaries-static-x64/*.zip
              require_glob "Windows shared arm64 C++ package" artifacts/windows-cpp-binaries-shared-arm64/*.zip
              require_glob "Windows static arm64 C++ package" artifacts/windows-cpp-binaries-static-arm64/*.zip
            fi
            for file in artifacts/linux-cpp-binaries-*/*; do
              cp "$file" dist/
            done
            if [ "${{ needs.check-tag.outputs.cpp-target }}" == "all" ]; then
              for file in artifacts/macos-cpp-binaries-*/* artifacts/windows-cpp-binaries-*/*; do
                cp "$file" dist/
              done
            fi
          fi

          # Python wheels
          if [ "${{ needs.check-tag.outputs.build-python }}" == "true" ]; then
            require_glob "Linux Python x86_64 wheels" artifacts/linux-python-wheels-x86_64/*.whl
            require_glob "Linux Python arm64 wheels" artifacts/linux-python-wheels-arm64/*.whl
            if [ "${{ needs.check-tag.outputs.python-target }}" == "all" ]; then
              require_glob "macOS Python x86_64 wheels" artifacts/macos-python-wheels-x86_64/*.whl
              require_glob "macOS Python arm64 wheels" artifacts/macos-python-wheels-arm64/*.whl
              require_glob "Windows Python x86_64 wheels" artifacts/windows-python-wheels-x86_64/*.whl
              require_glob "Windows Python arm64 wheels" artifacts/windows-python-wheels-arm64/*.whl
            fi
            for wheel in artifacts/linux-python-wheels-*/*.whl artifacts/macos-python-wheels-*/*.whl artifacts/windows-python-wheels-*/*.whl; do
              cp "$wheel" dist/
              cp "$wheel" pypi_dist/
            done
          fi

          # NPM native packages
          if [ "${{ needs.check-tag.outputs.build-npm }}" == "true" ]; then
            require_glob "Linux x64 npm native module" artifacts/npm-linux-x64/avioflow.node
            require_glob "Linux arm64 npm native module" artifacts/npm-linux-arm64/avioflow.node
            require_glob "macOS x64 npm native module" artifacts/npm-darwin-x64/avioflow.node
            require_glob "macOS arm64 npm native module" artifacts/npm-darwin-arm64/avioflow.node
            require_glob "Windows x64 npm native module" artifacts/npm-win32-x64/avioflow.node
            require_glob "Windows arm64 npm native module" artifacts/npm-win32-arm64/avioflow.node
            cp artifacts/npm-linux-x64/avioflow.node nodejs/npm-packages/@lxp3/linux-x64/
            cp artifacts/npm-linux-arm64/avioflow.node nodejs/npm-packages/@lxp3/linux-arm64/
            cp artifacts/npm-darwin-x64/avioflow.node nodejs/npm-packages/@lxp3/darwin-x64/
            cp artifacts/npm-darwin-arm64/avioflow.node nodejs/npm-packages/@lxp3/darwin-arm64/
            cp artifacts/npm-win32-x64/avioflow.node nodejs/npm-packages/@lxp3/win32-x64/
            cp artifacts/npm-win32-arm64/avioflow.node nodejs/npm-packages/@lxp3/win32-arm64/
          fi

          # WASM Engine
          if [ "${{ needs.check-tag.outputs.build-wasm }}" == "true" ]; then
             require_glob "WASM engine" artifacts/wasm-engine/avioflow-*.wasm
             require_glob "WASM JavaScript loader" artifacts/wasm-engine/avioflow-*.js
             cp artifacts/wasm-engine/avioflow-*.wasm dist/
             cp artifacts/wasm-engine/avioflow-*.js dist/
          fi

          # VS Code extension
          if [ "${{ needs.check-tag.outputs.build-vsix }}" == "true" ]; then
            require_glob "VS Code extension package" artifacts/vscode-extension/*.vsix
            cp artifacts/vscode-extension/*.vsix vsix_dist/
            cp artifacts/vscode-extension/*.vsix dist/
          fi

      # Upload to GitHub Release
      - name: Upload to GitHub Release
        if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-python == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.tag-name }}
          overwrite_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - name: Publish to PyPI
        if: needs.check-tag.outputs.build-python == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi_dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      # Publish VS Code extension to Open VSX
      - name: Publish to Open VSX
        if: needs.check-tag.outputs.build-vsix == 'true'
        working-directory: vsix_dist
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name '*.vsix' | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "No VSIX file found to publish"
            exit 1
          fi
          npx ovsx publish "$VSIX_FILE" -p "${{ secrets.OPENVSX_TOKEN }}"
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

      # Publish the main npm package only. The platform-specific native packages
      # are included in the release artifacts and are not published to npm here.
      - name: Publish avioflow (main package) to NPM
        if: needs.check-tag.outputs.build-npm == 'true'
        working-directory: nodejs
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists. Skipping."
          else
            pnpm publish --no-git-checks --access public --provenance || {
              echo "::warning::Failed to publish $PACKAGE_NAME@$PACKAGE_VERSION to npm. Skipping npm publish."
              exit 0
            }
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish to VS Code Marketplace (all platform-specific .vsix files)
      - name: Publish to VS Code Marketplace
        if: needs.check-tag.outputs.build-vsix == 'true'
        run: |
          echo "Publishing all .vsix files to VS Code Marketplace..."
          for VSIX_FILE in vsix_dist/*.vsix; do
            echo "Publishing $VSIX_FILE..."
            npx -y @vscode/vsce publish --packagePath "$VSIX_FILE"
          done
          echo "All platforms published!"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
