name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Required for provenance
  actions: write # Required for cancelling other jobs

jobs:
  # ============================================================
  # Determine what to build based on tag
  # Tag formats:
  #   v0.1.5       -> Build and publish everything (C++, Python, npm)
  #   v0.1.5-cpp   -> Build and publish C++ only
  #   v0.1.5-py    -> Build and publish Python wheels only
  #   v0.1.5-py-linux -> Build and publish Linux Python wheels only
  #   v0.1.5-npm   -> Build and publish npm only
  #   v0.1.5-vsix  -> Build and publish VS Code extension only
  # ============================================================
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      build-cpp: ${{ steps.check.outputs.build-cpp }}
      build-python: ${{ steps.check.outputs.build-python }}
      build-npm: ${{ steps.check.outputs.build-npm }}
      build-wasm: ${{ steps.check.outputs.build-wasm }}
      build-vsix: ${{ steps.check.outputs.build-vsix }}
      python-target: ${{ steps.check.outputs.python-target }}
      tag-name: ${{ steps.check.outputs.tag-name }}
    steps:
      - name: Check tag format
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag-name=$TAG" >> $GITHUB_OUTPUT
          
          # Default: build nothing
          BUILD_CPP="false"
          BUILD_PYTHON="false"
          BUILD_NPM="false"
          BUILD_WASM="false"
          BUILD_VSIX="false"
          PYTHON_TARGET="all"
          
          # Check tag suffix
          if [[ "$TAG" =~ -cpp$ ]]; then
            echo "Tag ends with -cpp: Building C++ only"
            BUILD_CPP="true"
          elif [[ "$TAG" =~ -py-linux$ ]]; then
            echo "Tag ends with -py-linux: Building Linux Python wheels only"
            BUILD_PYTHON="true"
            PYTHON_TARGET="linux"
          elif [[ "$TAG" =~ -py$ ]]; then
            echo "Tag ends with -py: Building Python wheels only"
            BUILD_PYTHON="true"
          elif [[ "$TAG" =~ -npm$ ]]; then
            echo "Tag ends with -npm: Building npm only"
            BUILD_NPM="true"
          elif [[ "$TAG" =~ -vsix$ ]]; then
            echo "Tag ends with -vsix: Building VS Code extension only"
            BUILD_VSIX="true"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag is version only: Building everything"
            BUILD_CPP="true"
            BUILD_PYTHON="true"
            BUILD_NPM="true"
          else
            echo "Unknown tag format: $TAG"
            echo "Supported formats: v0.1.5, v0.1.5-cpp, v0.1.5-py, v0.1.5-py-linux, v0.1.5-npm, v0.1.5-vsix"
            exit 1
          fi
          
          echo "build-cpp=$BUILD_CPP" >> $GITHUB_OUTPUT
          echo "build-python=$BUILD_PYTHON" >> $GITHUB_OUTPUT
          echo "build-npm=$BUILD_NPM" >> $GITHUB_OUTPUT
          echo "build-wasm=$BUILD_WASM" >> $GITHUB_OUTPUT
          echo "build-vsix=$BUILD_VSIX" >> $GITHUB_OUTPUT
          echo "python-target=$PYTHON_TARGET" >> $GITHUB_OUTPUT
          
          echo "Build configuration:"
          echo "  C++: $BUILD_CPP"
          echo "  Python: $BUILD_PYTHON"
          echo "  npm: $BUILD_NPM"
          echo "  Python target: $PYTHON_TARGET"
          echo "  VS Code Extension: $BUILD_VSIX"

  # ============================================================
  # Linux C++ Build (Maximum Compatibility - manylinux2014)
  # ============================================================
  build-linux-cpp:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker-image: quay.io/pypa/manylinux2014_x86_64
            pkg-dir: avioflow-shared-linux-x64
            artifact-name: linux-cpp-binaries-x86_64
          - arch: aarch64
            docker-image: quay.io/pypa/manylinux2014_aarch64
            pkg-dir: avioflow-shared-linux-arm64
            artifact-name: linux-cpp-binaries-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build C++ Shared Binaries in manylinux2014 (${{ matrix.arch }})
        run: |
          docker run --rm -v $(pwd):/io -w /io ${{ matrix.docker-image }} bash -c "
            yum install -y epel-release && \
            yum install -y alsa-lib-devel libX11-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel \
              lame-devel opus-devel speex-devel libvorbis-devel && \
            cmake -B build_shared -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DENABLE_WASAPI=OFF -DENABLE_PYTHON=OFF -DENABLE_NODE_JS=OFF -DENABLE_BINARY=ON && \
            cmake --build build_shared --config Release -j \$(nproc) && \
            PKG_DIR=\"${{ matrix.pkg-dir }}\" && \
            cmake --install build_shared --prefix \$PKG_DIR && \
            tar -czvf \$PKG_DIR.tar.gz \$PKG_DIR
          "

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.pkg-dir }}.tar.gz

  # ============================================================
  # Linux Node.js Build (Modern - manylinux_2_28)
  # ============================================================
  build-linux-npm:
    needs: check-tag
    if: needs.check-tag.outputs.build-npm == 'true'
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Install System Dependencies
        run: |
          dnf install -y bzip2-devel xz-devel libva-devel libdrm-devel

      - name: Install Node.js 20
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
          npm install -g pnpm

      - name: Build Node.js Addon
        run: |
          bash build-nodejs.sh
          cp build-nodejs/bin/avioflow.node nodejs/npm-packages/@lxp3/linux-x64/avioflow.node

      - name: Verify Node.js Addon
        working-directory: nodejs
        run: |
          export AVIOFLOW_BINDINGS_PATH="$(pwd)/npm-packages/@lxp3/linux-x64/avioflow.node"
          node tests/test-offline-load.js

      - uses: actions/upload-artifact@v4
        with:
          name: npm-linux-x64
          path: nodejs/npm-packages/@lxp3/linux-x64/

      - name: Cancel workflow on failure
        if: failure()
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Build Python Wheels (Linux, Shared) ---
  build-python-linux-x86_64:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true' && (needs.check-tag.outputs.python-target == 'all' || needs.check-tag.outputs.python-target == 'linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python
          config-file: python/pyproject.toml
        env:
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: |
            set -euo pipefail
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y make autoconf automake libtool pkgconfig perl-core tar xz alsa-lib-devel libX11-devel libxcb-devel libXau-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel libatomic
            else
              yum install -y epel-release
              yum install -y make autoconf automake libtool pkgconfig perl-core tar xz alsa-lib-devel libX11-devel libxcb-devel libXau-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel libatomic
            fi

            DEPS_PREFIX=/opt/ffmpeg-deps &&
            mkdir -p "$DEPS_PREFIX" &&
            export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib64/pkgconfig" &&
            export CPPFLAGS="-I$DEPS_PREFIX/include" &&
            export CFLAGS="-fPIC" &&
            export CXXFLAGS="-fPIC" &&
            export LDFLAGS="-L$DEPS_PREFIX/lib -L$DEPS_PREFIX/lib64" &&
            export PATH="$DEPS_PREFIX/bin:$PATH" &&

            build_autotools_dep() {
              local name="$1"
              local version="$2"
              local url="$3"
              local dir="$4"
              local lib_name="$5"
              shift 5
              local mirrors=("$@")

              if [ -f "$DEPS_PREFIX/lib/${lib_name}" ] || [ -f "$DEPS_PREFIX/lib64/${lib_name}" ]; then
                return 0
              fi
              rm -rf "/tmp/$dir"

              local downloaded=0
              for try_url in "$url" "${mirrors[@]}"; do
                echo "Trying to download from: $try_url"
                if curl -4 --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 2 -fsSL "$try_url" -o "/tmp/$name-$version.tar.gz"; then
                  downloaded=1
                  break
                fi
                echo "Failed to download from $try_url, trying next mirror..."
              done

              if [ $downloaded -eq 0 ]; then
                echo "Failed to download $name from all sources" >&2
                exit 1
              fi

              tar -xzf "/tmp/$name-$version.tar.gz" -C /tmp
              cd "/tmp/$dir"
              ./configure --prefix="$DEPS_PREFIX" --libdir="$DEPS_PREFIX/lib" --disable-dependency-tracking --disable-shared --enable-static
              make -j"$(nproc)"
              make install
              if [ ! -f "$DEPS_PREFIX/lib/${lib_name}" ] && [ ! -f "$DEPS_PREFIX/lib64/${lib_name}" ]; then
                echo "Missing static dependency after building $name: $lib_name under $DEPS_PREFIX/lib or $DEPS_PREFIX/lib64" >&2
                find "$DEPS_PREFIX" -maxdepth 3 -type f -name '*.a' -print >&2 || true
                exit 1
              fi
              cd /project
            }

            verify_static_dep() {
              local name="$1"
              if [ ! -f "$DEPS_PREFIX/lib/lib${name}.a" ] && [ ! -f "$DEPS_PREFIX/lib64/lib${name}.a" ]; then
                echo "Missing static dependency: lib${name}.a under $DEPS_PREFIX/lib or $DEPS_PREFIX/lib64" >&2
                find "$DEPS_PREFIX" -maxdepth 3 -type f -name '*.a' -print >&2 || true
                exit 1
              fi
            }

            curl -4 --connect-timeout 30 --max-time 300 --retry 10 --retry-delay 3 --retry-max-time 600 -fsSL https://www.openssl.org/source/openssl-3.0.14.tar.gz -o /tmp/openssl-3.0.14.tar.gz &&
            tar -xzf /tmp/openssl-3.0.14.tar.gz -C /tmp &&
            cd /tmp/openssl-3.0.14 &&
            if [ "$(uname -m)" = "aarch64" ]; then OPENSSL_TARGET=linux-aarch64; else OPENSSL_TARGET=linux-x86_64; fi &&
            ./Configure "$OPENSSL_TARGET" no-shared --prefix="$DEPS_PREFIX" --libdir=lib &&
            make -j"$(nproc)" &&
            make install_sw &&
            cd /project &&
            build_autotools_dep ogg 1.3.5 https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz libogg-1.3.5 libogg.a https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-1.3.5.tar.gz https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz &&
            build_autotools_dep vorbis 1.3.7 https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz libvorbis-1.3.7 libvorbis.a https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz &&
            build_autotools_dep speex 1.2.1 https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz speex-1.2.1 libspeex.a https://ftp.osuosl.org/pub/xiph/releases/speex/speex-1.2.1.tar.gz https://github.com/xiph/speex/releases/download/Speex-1.2.1/speex-1.2.1.tar.gz &&
            build_autotools_dep opus 1.5.2 https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz opus-1.5.2 libopus.a https://ftp.osuosl.org/pub/xiph/releases/opus/opus-1.5.2.tar.gz https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz &&
            build_autotools_dep lame 3.100 https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz lame-3.100 libmp3lame.a https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download &&
            verify_static_dep ssl &&
            verify_static_dep crypto &&
            verify_static_dep ogg &&
            verify_static_dep vorbis &&
            verify_static_dep vorbisenc &&
            verify_static_dep speex &&
            verify_static_dep opus &&
            verify_static_dep mp3lame
          CIBW_ENVIRONMENT_LINUX: "CMAKE_ARGS='-DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH=/opt/ffmpeg-deps -DCMAKE_LIBRARY_PATH=/opt/ffmpeg-deps/lib;/opt/ffmpeg-deps/lib64' CMAKE_PREFIX_PATH=/opt/ffmpeg-deps CMAKE_LIBRARY_PATH='/opt/ffmpeg-deps/lib:/opt/ffmpeg-deps/lib64'"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/python/tests/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-python-wheels-x86_64
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-linux-arm64:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true' && (needs.check-tag.outputs.python-target == 'all' || needs.check-tag.outputs.python-target == 'linux')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python
          config-file: python/pyproject.toml
        env:
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: |
            set -euo pipefail
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y make autoconf automake libtool pkgconfig perl-core tar xz alsa-lib-devel libX11-devel libxcb-devel libXau-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel libatomic
            else
              yum install -y epel-release
              yum install -y make autoconf automake libtool pkgconfig perl-core tar xz alsa-lib-devel libX11-devel libxcb-devel libXau-devel zlib-devel bzip2-devel xz-devel libva-devel libdrm-devel libatomic
            fi

            DEPS_PREFIX=/opt/ffmpeg-deps &&
            mkdir -p "$DEPS_PREFIX" &&
            export PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig:$DEPS_PREFIX/lib64/pkgconfig" &&
            export CPPFLAGS="-I$DEPS_PREFIX/include" &&
            export CFLAGS="-fPIC" &&
            export CXXFLAGS="-fPIC" &&
            export LDFLAGS="-L$DEPS_PREFIX/lib -L$DEPS_PREFIX/lib64" &&
            export PATH="$DEPS_PREFIX/bin:$PATH" &&

            build_autotools_dep() {
              local name="$1"
              local version="$2"
              local url="$3"
              local dir="$4"
              local lib_name="$5"
              shift 5
              local mirrors=("$@")

              if [ -f "$DEPS_PREFIX/lib/${lib_name}" ] || [ -f "$DEPS_PREFIX/lib64/${lib_name}" ]; then
                return 0
              fi
              rm -rf "/tmp/$dir"

              local downloaded=0
              for try_url in "$url" "${mirrors[@]}"; do
                echo "Trying to download from: $try_url"
                if curl -4 --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 2 -fsSL "$try_url" -o "/tmp/$name-$version.tar.gz"; then
                  downloaded=1
                  break
                fi
                echo "Failed to download from $try_url, trying next mirror..."
              done

              if [ $downloaded -eq 0 ]; then
                echo "Failed to download $name from all sources" >&2
                exit 1
              fi

              tar -xzf "/tmp/$name-$version.tar.gz" -C /tmp
              cd "/tmp/$dir"
              ./configure --prefix="$DEPS_PREFIX" --libdir="$DEPS_PREFIX/lib" --disable-dependency-tracking --disable-shared --enable-static
              make -j"$(nproc)"
              make install
              if [ ! -f "$DEPS_PREFIX/lib/${lib_name}" ] && [ ! -f "$DEPS_PREFIX/lib64/${lib_name}" ]; then
                echo "Missing static dependency after building $name: $lib_name under $DEPS_PREFIX/lib or $DEPS_PREFIX/lib64" >&2
                find "$DEPS_PREFIX" -maxdepth 3 -type f -name '*.a' -print >&2 || true
                exit 1
              fi
              cd /project
            }

            verify_static_dep() {
              local name="$1"
              if [ ! -f "$DEPS_PREFIX/lib/lib${name}.a" ] && [ ! -f "$DEPS_PREFIX/lib64/lib${name}.a" ]; then
                echo "Missing static dependency: lib${name}.a under $DEPS_PREFIX/lib or $DEPS_PREFIX/lib64" >&2
                find "$DEPS_PREFIX" -maxdepth 3 -type f -name '*.a' -print >&2 || true
                exit 1
              fi
            }

            curl -4 --connect-timeout 30 --max-time 300 --retry 10 --retry-delay 3 --retry-max-time 600 -fsSL https://www.openssl.org/source/openssl-3.0.14.tar.gz -o /tmp/openssl-3.0.14.tar.gz &&
            tar -xzf /tmp/openssl-3.0.14.tar.gz -C /tmp &&
            cd /tmp/openssl-3.0.14 &&
            if [ "$(uname -m)" = "aarch64" ]; then OPENSSL_TARGET=linux-aarch64; else OPENSSL_TARGET=linux-x86_64; fi &&
            ./Configure "$OPENSSL_TARGET" no-shared --prefix="$DEPS_PREFIX" --libdir=lib &&
            make -j"$(nproc)" &&
            make install_sw &&
            cd /project &&
            build_autotools_dep ogg 1.3.5 https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz libogg-1.3.5 libogg.a https://ftp.osuosl.org/pub/xiph/releases/ogg/libogg-1.3.5.tar.gz https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz &&
            build_autotools_dep vorbis 1.3.7 https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz libvorbis-1.3.7 libvorbis.a https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz &&
            build_autotools_dep speex 1.2.1 https://downloads.xiph.org/releases/speex/speex-1.2.1.tar.gz speex-1.2.1 libspeex.a https://ftp.osuosl.org/pub/xiph/releases/speex/speex-1.2.1.tar.gz https://github.com/xiph/speex/releases/download/Speex-1.2.1/speex-1.2.1.tar.gz &&
            build_autotools_dep opus 1.5.2 https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz opus-1.5.2 libopus.a https://ftp.osuosl.org/pub/xiph/releases/opus/opus-1.5.2.tar.gz https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz &&
            build_autotools_dep lame 3.100 https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz lame-3.100 libmp3lame.a https://sourceforge.net/projects/lame/files/lame/3.100/lame-3.100.tar.gz/download &&
            verify_static_dep ssl &&
            verify_static_dep crypto &&
            verify_static_dep ogg &&
            verify_static_dep vorbis &&
            verify_static_dep vorbisenc &&
            verify_static_dep speex &&
            verify_static_dep opus &&
            verify_static_dep mp3lame
          CIBW_ENVIRONMENT_LINUX: "CMAKE_ARGS='-DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH=/opt/ffmpeg-deps -DCMAKE_LIBRARY_PATH=/opt/ffmpeg-deps/lib;/opt/ffmpeg-deps/lib64' CMAKE_PREFIX_PATH=/opt/ffmpeg-deps CMAKE_LIBRARY_PATH='/opt/ffmpeg-deps/lib:/opt/ffmpeg-deps/lib64'"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/python/tests/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-python-wheels-arm64
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- macOS C++ Build (Shared + Static, x86_64 + arm64) ---
  build-macos-cpp:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            brew-prefix: /usr/local
            shared-libs: "ON"
            package-kind: shared
            pkg-dir: avioflow-shared-macos-x64
            artifact-name: macos-cpp-binaries-shared-x86_64
          - arch: x86_64
            runner: macos-15-intel
            brew-prefix: /usr/local
            shared-libs: "OFF"
            package-kind: static
            pkg-dir: avioflow-static-macos-x64
            artifact-name: macos-cpp-binaries-static-x86_64
          - arch: aarch64
            runner: macos-15
            brew-prefix: /opt/homebrew
            shared-libs: "ON"
            package-kind: shared
            pkg-dir: avioflow-shared-macos-arm64
            artifact-name: macos-cpp-binaries-shared-aarch64
          - arch: aarch64
            runner: macos-15
            brew-prefix: /opt/homebrew
            shared-libs: "OFF"
            package-kind: static
            pkg-dir: avioflow-static-macos-arm64
            artifact-name: macos-cpp-binaries-static-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Install system dependencies
        run: brew install openssl@3 lame opus speex libogg libvorbis

      - name: Build macOS C++ ${{ matrix.package-kind }} (${{ matrix.arch }})
        run: |
          export CMAKE_PREFIX_PATH="${{ matrix.brew-prefix }}/opt/openssl@3:${{ matrix.brew-prefix }}/opt/lame:${{ matrix.brew-prefix }}/opt/opus:${{ matrix.brew-prefix }}/opt/speex:${{ matrix.brew-prefix }}/opt/libogg:${{ matrix.brew-prefix }}/opt/libvorbis"
          export CMAKE_LIBRARY_PATH="${{ matrix.brew-prefix }}/lib"
          cmake -B build_macos_${{ matrix.package-kind }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_SHARED_LIBS=${{ matrix.shared-libs }} \
            -DENABLE_WASAPI=OFF \
            -DENABLE_PYTHON=OFF \
            -DENABLE_NODE_JS=OFF \
            -DENABLE_BINARY=ON
          cmake --build build_macos_${{ matrix.package-kind }} --config Release -j "$(sysctl -n hw.logicalcpu)"
          cmake --install build_macos_${{ matrix.package-kind }} --prefix "${{ matrix.pkg-dir }}" --config Release
          if [ "${{ matrix.package-kind }}" = "shared" ]; then
            for dylib in "${{ matrix.pkg-dir }}"/lib/*.dylib; do
              [ -e "$dylib" ] || continue
              install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" || true
            done
            for target in "${{ matrix.pkg-dir }}"/lib/*.dylib "${{ matrix.pkg-dir }}"/bin/*; do
              [ -e "$target" ] || continue
              otool -L "$target" 2>/dev/null | awk '/lib(av|sw).*\.dylib/{print $1}' | while read -r dep; do
                install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$target" || true
              done
            done
          fi
          tar -czvf "${{ matrix.pkg-dir }}.tar.gz" "${{ matrix.pkg-dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.pkg-dir }}.tar.gz

  # ============================================================
  # Windows Build (C++ + Node.js + Python Wheels)
  # ============================================================
  build-windows:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-npm == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        shell: pwsh
        run: python scripts/sync_version.py

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: nodejs/pnpm-lock.yaml

      # --- Build C++ Shared Binaries (Only if build-cpp is true) ---
      - name: Build C++ Shared Binaries
        if: needs.check-tag.outputs.build-cpp == 'true'
        shell: pwsh
        run: |
          cmake -B build_shared `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DENABLE_WASAPI=ON `
            -DENABLE_PYTHON=OFF `
            -DENABLE_NODE_JS=OFF `
            -DENABLE_BINARY=ON
          cmake --build build_shared --config Release -j 4

      - name: Package C++ Binaries
        if: needs.check-tag.outputs.build-cpp == 'true'
        shell: pwsh
        run: |
          $PkgDir = "avioflow-shared-win-x64"
          cmake --install build_shared --prefix $PkgDir --config Release
          Compress-Archive -Path "$PkgDir/*" -DestinationPath "$PkgDir.zip"

      # --- Build Node.js Addon (Static, Node-API 8 for Node.js >= 16) ---
      - name: Build Node.js Addon (Node-API 8)
        if: needs.check-tag.outputs.build-npm == 'true'
        shell: pwsh
        run: |
          # Use the specialized build script
          ./build-nodejs.ps1

          # Copy to platform-specific package directory
          $outputFile = "build-nodejs/bin/avioflow.node"
          if (-not (Test-Path $outputFile)) { $outputFile = "build-nodejs/bin/Release/avioflow.node" }
          Copy-Item $outputFile "nodejs/npm-packages/@lxp3/win32-x64/avioflow.node"

          Write-Host "=== Platform Package Info ==="
          Write-Host "Package: @lxp3/win32-x64"
          Write-Host "Node-API version: 8"
          Write-Host "Compatible with: Node.js 16+"
          Get-ChildItem nodejs/npm-packages/@lxp3/win32-x64/

      # Verify the built module works
      - name: Verify Node.js Addon
        if: needs.check-tag.outputs.build-npm == 'true'
        shell: pwsh
        working-directory: nodejs
        run: |
          Write-Host "Verifying native module loads correctly..."
          node -e "const m = require('./npm-packages/@lxp3/win32-x64/avioflow.node'); console.log('Exports:', Object.keys(m));"

          $env:AVIOFLOW_BINDINGS_PATH = "$(Get-Location)/npm-packages/@lxp3/win32-x64/avioflow.node"
          node tests/test-offline-load.js
          Write-Host "Verification passed!"

      # --- Upload Artifacts ---
      - uses: actions/upload-artifact@v4
        if: needs.check-tag.outputs.build-cpp == 'true'
        with:
          name: windows-cpp-binaries
          path: avioflow-shared-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: needs.check-tag.outputs.build-npm == 'true'
        with:
          name: npm-win32-x64
          path: nodejs/npm-packages/@lxp3/win32-x64/

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Build Python Wheels (macOS, Static) ---
  build-python-macos:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true' && needs.check-tag.outputs.python-target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            brew-prefix: /usr/local
          - arch: arm64
            runner: macos-15
            brew-prefix: /opt/homebrew
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python
          config-file: python/pyproject.toml
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp*"
          CIBW_BEFORE_ALL_MACOS: "brew install openssl@3 lame opus speex libogg libvorbis"
          CIBW_ENVIRONMENT_MACOS: "CMAKE_ARGS=-DBUILD_SHARED_LIBS=OFF MACOSX_DEPLOYMENT_TARGET=12.0 CMAKE_PREFIX_PATH=${{ matrix.brew-prefix }}/opt/openssl@3:${{ matrix.brew-prefix }}/opt/lame:${{ matrix.brew-prefix }}/opt/opus:${{ matrix.brew-prefix }}/opt/speex:${{ matrix.brew-prefix }}/opt/libogg:${{ matrix.brew-prefix }}/opt/libvorbis CMAKE_LIBRARY_PATH=${{ matrix.brew-prefix }}/lib"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/python/tests/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-python-wheels-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Build Python Wheels (Windows, Shared) ---
  build-python-windows-x86_64:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true' && needs.check-tag.outputs.python-target == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        shell: pwsh
        run: python scripts/sync_version.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python
          config-file: python/pyproject.toml
        env:
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-win32"
          CIBW_ENVIRONMENT_WINDOWS: "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/python/tests/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-python-wheels-x86_64
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-windows-arm64:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true' && needs.check-tag.outputs.python-target == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        shell: pwsh
        run: python scripts/sync_version.py

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: python
          config-file: python/pyproject.toml
        env:
          CIBW_ARCHS_WINDOWS: ARM64
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* *-win32"
          CIBW_ENVIRONMENT_WINDOWS: "CMAKE_ARGS=-DBUILD_SHARED_LIBS=ON"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: "python {project}/python/tests/test_offline_load.py {project}/public/wavs/TownTheme.mp3"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-python-wheels-arm64
          path: ./wheelhouse/*.whl

      - name: Cancel workflow on failure
        if: failure()
        run: gh run cancel ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Build WASM Engine (Platform Independent)
  # ============================================================
  build-wasm:
    needs: check-tag
    if: needs.check-tag.outputs.build-wasm == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        shell: pwsh
        run: python scripts/sync_version.py

      - name: Build WASM
        shell: pwsh
        run: ./build-wasm.ps1

      - name: Prepare WASM Artifact
        shell: pwsh
        run: |
          $TAG = "${{ needs.check-tag.outputs.tag-name }}"
          $VERSION = $TAG.TrimStart('v').Replace('-vsix', '')
          Copy-Item "wasm/dist/avioflow.wasm" "avioflow-$VERSION.wasm"
          Copy-Item "wasm/dist/avioflow.js" "avioflow-$VERSION.js"

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-engine
          path: |
            avioflow-*.wasm
            avioflow-*.js
            wasm/dist/

  # ============================================================
  # Build VS Code Extension (.vsix)
  # ============================================================
  build-vsix:
    needs: check-tag
    if: needs.check-tag.outputs.build-vsix == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        shell: pwsh
        run: python scripts/sync_version.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: vscode-extension/pnpm-lock.yaml

      - name: Build and Package Extension
        shell: pwsh
        run: ./build-vsix.ps1

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix

  # ============================================================
  # Publish to GitHub, PyPI, NPM, and VS Code Marketplace
  # ============================================================
  publish:
    needs: [check-tag, build-linux-cpp, build-linux-npm, build-python-linux-x86_64, build-python-linux-arm64, build-macos-cpp, build-python-macos, build-windows, build-python-windows-x86_64, build-python-windows-arm64, build-wasm, build-vsix]
    runs-on: ubuntu-latest
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.check-tag.result == 'success') &&
      (needs.build-linux-cpp.result == 'success' || needs.build-linux-cpp.result == 'skipped') &&
      (needs.build-linux-npm.result == 'success' || needs.build-linux-npm.result == 'skipped') &&
      (needs.build-macos-cpp.result == 'success' || needs.build-macos-cpp.result == 'skipped') &&
      (needs.build-python-macos.result == 'success' || needs.build-python-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-python-linux-x86_64.result == 'success' || needs.build-python-linux-x86_64.result == 'skipped') &&
      (needs.build-python-linux-arm64.result == 'success' || needs.build-python-linux-arm64.result == 'skipped') &&
      (needs.build-python-windows-x86_64.result == 'success' || needs.build-python-windows-x86_64.result == 'skipped') &&
      (needs.build-python-windows-arm64.result == 'success' || needs.build-python-windows-arm64.result == 'skipped') &&
      (needs.build-python-windows.result == 'success' || needs.build-python-windows.result == 'skipped') &&
      (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped') &&
      (needs.build-vsix.result == 'success' || needs.build-vsix.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: needs.check-tag.outputs.build-npm == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: needs.check-tag.outputs.build-npm == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Download all artifacts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      # Prepare directories
      - name: Prepare release files
        run: |
          mkdir -p dist pypi_dist vsix_dist

          # C++ binaries
          if [ "${{ needs.check-tag.outputs.build-cpp }}" == "true" ]; then
            cp artifacts/linux-cpp-binaries-*/* dist/ || true
            cp artifacts/macos-cpp-binaries-*/* dist/ || true
            cp artifacts/windows-cpp-binaries/* dist/ || true
          fi

          # Python wheels
          if [ "${{ needs.check-tag.outputs.build-python }}" == "true" ]; then
            cp artifacts/linux-python-wheels-x86_64/*.whl dist/ || true
            cp artifacts/linux-python-wheels-arm64/*.whl dist/ || true
            cp artifacts/macos-python-wheels-*/*.whl dist/ || true
            cp artifacts/windows-python-wheels-x86_64/*.whl dist/ || true
            cp artifacts/windows-python-wheels-arm64/*.whl dist/ || true
            cp artifacts/linux-python-wheels-x86_64/*.whl pypi_dist/ || true
            cp artifacts/linux-python-wheels-arm64/*.whl pypi_dist/ || true
            cp artifacts/macos-python-wheels-*/*.whl pypi_dist/ || true
            cp artifacts/windows-python-wheels-x86_64/*.whl pypi_dist/ || true
            cp artifacts/windows-python-wheels-arm64/*.whl pypi_dist/ || true
          fi

          # WASM Engine
          if [ "${{ needs.check-tag.outputs.build-wasm }}" == "true" ]; then
             cp artifacts/wasm-engine/avioflow-*.wasm dist/ || true
             cp artifacts/wasm-engine/avioflow-*.js dist/ || true
          fi

          # VS Code extension
          if [ "${{ needs.check-tag.outputs.build-vsix }}" == "true" ]; then
            cp artifacts/vscode-extension/*.vsix vsix_dist/ || true
            cp artifacts/vscode-extension/*.vsix dist/ || true
          fi

      # Upload to GitHub Release
      - name: Upload to GitHub Release
        if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-python == 'true' || needs.check-tag.outputs.build-vsix == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - name: Publish to PyPI
        if: needs.check-tag.outputs.build-python == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi_dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      # Publish VS Code extension to Open VSX
      - name: Publish to Open VSX
        if: needs.check-tag.outputs.build-vsix == 'true'
        working-directory: vsix_dist
        run: |
          VSIX_FILE=$(find . -maxdepth 1 -name '*.vsix' | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "No VSIX file found to publish"
            exit 1
          fi
          npx ovsx publish "$VSIX_FILE" -p "${{ secrets.OPENVSX_TOKEN }}"
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}

      # Publish platform-specific packages first, then main package
      - name: Publish @lxp3/linux-x64 to NPM
        if: needs.check-tag.outputs.build-npm == 'true'
        working-directory: nodejs/npm-packages/@lxp3/linux-x64
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists. Skipping."
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @lxp3/win32-x64 to NPM
        if: needs.check-tag.outputs.build-npm == 'true'
        working-directory: nodejs/npm-packages/@lxp3/win32-x64
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists. Skipping."
          else
            pnpm publish --no-git-checks --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish avioflow (main package) to NPM
        if: needs.check-tag.outputs.build-npm == 'true'
        working-directory: nodejs
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists. Skipping."
          else
            pnpm publish --no-git-checks --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish to VS Code Marketplace (all platform-specific .vsix files)
      - name: Publish to VS Code Marketplace
        if: needs.check-tag.outputs.build-vsix == 'true'
        run: |
          echo "Publishing all .vsix files to VS Code Marketplace..."
          for VSIX_FILE in vsix_dist/*.vsix; do
            echo "Publishing $VSIX_FILE..."
            npx -y @vscode/vsce publish --packagePath "$VSIX_FILE"
          done
          echo "All platforms published!"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
