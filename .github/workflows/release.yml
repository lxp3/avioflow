name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag or build selector, for example v0.3.4 or v0.3.4-linux-cpp'
        required: true
        default: 'v0.3.4'
      publish:
        description: 'Publish Release, PyPI, npm and Maven artifacts'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      build-cpp: ${{ steps.check.outputs.build-cpp }}
      build-python: ${{ steps.check.outputs.build-python }}
      build-npm: ${{ steps.check.outputs.build-npm }}
      build-wasm: ${{ steps.check.outputs.build-wasm }}
      build-java: ${{ steps.check.outputs.build-java }}
      build-rust: ${{ steps.check.outputs.build-rust }}
      build-go: ${{ steps.check.outputs.build-go }}
      python-target: ${{ steps.check.outputs.python-target }}
      cpp-target: ${{ steps.check.outputs.cpp-target }}
      tag-name: ${{ steps.check.outputs.tag-name }}
    steps:
      - name: Check tag format
        id: check
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag-name=$TAG" >> $GITHUB_OUTPUT
          
          # Default: build nothing
          BUILD_CPP="false"
          BUILD_PYTHON="false"
          BUILD_NPM="false"
          BUILD_WASM="false"
          BUILD_JAVA="false"
          BUILD_RUST="false"
          BUILD_GO="false"
          PYTHON_TARGET="all"
          CPP_TARGET="all"
          
          # Check tag suffix
          if [[ "$TAG" =~ -linux-cpp$ ]]; then
            echo "Tag ends with -linux-cpp: Building Linux C++ only"
            BUILD_CPP="true"
            CPP_TARGET="linux"
          elif [[ "$TAG" =~ -cpp$ ]]; then
            echo "Tag ends with -cpp: Building C++ only"
            BUILD_CPP="true"
          elif [[ "$TAG" =~ -py-linux$ ]]; then
            echo "Tag ends with -py-linux: Building Linux Python wheels only"
            BUILD_PYTHON="true"
            PYTHON_TARGET="linux"
          elif [[ "$TAG" =~ -py$ ]]; then
            echo "Tag ends with -py: Building Python wheels only"
            BUILD_PYTHON="true"
          elif [[ "$TAG" =~ -npm$ ]]; then
            echo "Tag ends with -npm: Building npm only"
            BUILD_NPM="true"
          elif [[ "$TAG" =~ -wasm$ ]]; then
            echo "Tag ends with -wasm: Building WASM only"
            BUILD_WASM="true"
          elif [[ "$TAG" =~ -java$ ]]; then
            echo "Tag ends with -java: Building Java only"
            BUILD_JAVA="true"
          elif [[ "$TAG" =~ -rust$ ]]; then
            echo "Tag ends with -rust: Building Rust only"
            BUILD_RUST="true"
          elif [[ "$TAG" =~ -go$ ]]; then
            echo "Tag ends with -go: Building Go only"
            BUILD_GO="true"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag is version only: Building everything"
            BUILD_CPP="true"
            BUILD_PYTHON="true"
            BUILD_NPM="true"
            BUILD_JAVA="true"
            BUILD_WASM="true"
            BUILD_RUST="true"
            BUILD_GO="true"
          else
            echo "Unknown tag format: $TAG"
            echo "Supported formats: v0.1.5, v0.1.5-cpp, v0.1.5-linux-cpp, v0.1.5-py, v0.1.5-py-linux, v0.1.5-npm, v0.1.5-wasm, v0.1.5-java, v0.1.5-rust, v0.1.5-go"
            exit 1
          fi
          
          echo "build-cpp=$BUILD_CPP" >> $GITHUB_OUTPUT
          echo "build-python=$BUILD_PYTHON" >> $GITHUB_OUTPUT
          echo "build-npm=$BUILD_NPM" >> $GITHUB_OUTPUT
          echo "build-wasm=$BUILD_WASM" >> $GITHUB_OUTPUT
          echo "build-java=$BUILD_JAVA" >> $GITHUB_OUTPUT
          echo "build-rust=$BUILD_RUST" >> $GITHUB_OUTPUT
          echo "build-go=$BUILD_GO" >> $GITHUB_OUTPUT
          echo "python-target=$PYTHON_TARGET" >> $GITHUB_OUTPUT
          echo "cpp-target=$CPP_TARGET" >> $GITHUB_OUTPUT
          
          echo "Build configuration:"
          echo "  C++: $BUILD_CPP"
          echo "  Python: $BUILD_PYTHON"
          echo "  npm: $BUILD_NPM"
          echo "  C++ target: $CPP_TARGET"
          echo "  Python target: $PYTHON_TARGET"
          echo "  WASM: $BUILD_WASM"
          echo "  Java: $BUILD_JAVA"
          echo "  Rust: $BUILD_RUST"
          echo "  Go: $BUILD_GO"

  cpp:
    needs: check-tag
    if: needs.check-tag.outputs.build-cpp == 'true'
    uses: ./.github/workflows/cpp.yml
    with:
      build-cpp: ${{ needs.check-tag.outputs.build-cpp == 'true' }}
      cpp-target: ${{ needs.check-tag.outputs.cpp-target }}
    secrets: inherit

  node:
    needs: check-tag
    if: needs.check-tag.outputs.build-npm == 'true'
    uses: ./.github/workflows/node.yml
    with:
      build-npm: ${{ needs.check-tag.outputs.build-npm == 'true' }}
    secrets: inherit

  windows:
    needs: check-tag
    if: (needs.check-tag.outputs.build-cpp == 'true' && needs.check-tag.outputs.cpp-target == 'all') || needs.check-tag.outputs.build-npm == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      build-cpp: ${{ needs.check-tag.outputs.build-cpp == 'true' }}
      build-npm: ${{ needs.check-tag.outputs.build-npm == 'true' }}
    secrets: inherit

  python:
    needs: check-tag
    if: needs.check-tag.outputs.build-python == 'true'
    uses: ./.github/workflows/python.yml
    with:
      build-python: ${{ needs.check-tag.outputs.build-python == 'true' }}
      python-target: ${{ needs.check-tag.outputs.python-target }}
    secrets: inherit

  java:
    needs: check-tag
    if: needs.check-tag.outputs.build-java == 'true'
    uses: ./.github/workflows/java.yml
    secrets: inherit

  wasm:
    needs: check-tag
    if: needs.check-tag.outputs.build-wasm == 'true'
    uses: ./.github/workflows/wasm.yml
    with:
      build-wasm: ${{ needs.check-tag.outputs.build-wasm == 'true' }}
    secrets: inherit

  rust:
    needs: check-tag
    if: needs.check-tag.outputs.build-rust == 'true'
    uses: ./.github/workflows/rust.yml
    secrets: inherit

  go:
    needs: check-tag
    if: needs.check-tag.outputs.build-go == 'true'
    uses: ./.github/workflows/go.yml
    secrets: inherit

  publish:
    needs: [check-tag, cpp, node, windows, python, java, wasm, rust, go]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      (needs.check-tag.result == 'success') &&
      (needs.cpp.result == 'success' || needs.cpp.result == 'skipped') &&
      (needs.node.result == 'success' || needs.node.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped') &&
      (needs.java.result == 'success' || needs.java.result == 'skipped') &&
      (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.go.result == 'success' || needs.go.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: needs.check-tag.outputs.build-npm == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      # cargo publish compiles the crate, which builds the C++ core, so this
      # needs a toolchain even though the rust job already ran.
      - name: Setup Rust
        if: needs.check-tag.outputs.build-rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Download all artifacts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Prepare directories
      - name: Prepare release files
        run: |
          shopt -s nullglob
          mkdir -p dist pypi_dist
          require_glob() {
            local description="$1"
            shift
            local matches=("$@")
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "Missing required artifact: $description"
              exit 1
            fi
          }

          # C++ binaries
          if [ "${{ needs.check-tag.outputs.build-cpp }}" == "true" ]; then
            for kind in shared static; do for arch in x86_64 aarch64; do for abi in 0 1; do require_glob "Linux $kind $arch ABI $abi C++ package" artifacts/linux-cpp-binaries-$kind-$arch-abi$abi/*.tar.gz; done; done; done
            if [ "${{ needs.check-tag.outputs.cpp-target }}" == "all" ]; then
              require_glob "macOS shared x86_64 C++ package" artifacts/macos-cpp-binaries-shared-x86_64/*.tar.gz
              require_glob "macOS static x86_64 C++ package" artifacts/macos-cpp-binaries-static-x86_64/*.tar.gz
              require_glob "macOS shared arm64 C++ package" artifacts/macos-cpp-binaries-shared-aarch64/*.tar.gz
              require_glob "macOS static arm64 C++ package" artifacts/macos-cpp-binaries-static-aarch64/*.tar.gz
              require_glob "Windows shared x64 C++ package" artifacts/windows-cpp-binaries-shared-x64/*.zip
              require_glob "Windows static x64 C++ package" artifacts/windows-cpp-binaries-static-x64/*.zip
              require_glob "Windows shared arm64 C++ package" artifacts/windows-cpp-binaries-shared-arm64/*.zip
              require_glob "Windows static arm64 C++ package" artifacts/windows-cpp-binaries-static-arm64/*.zip
            fi
            for file in artifacts/linux-cpp-binaries-*/*; do
              cp "$file" dist/
            done
            if [ "${{ needs.check-tag.outputs.cpp-target }}" == "all" ]; then
              for file in artifacts/macos-cpp-binaries-*/* artifacts/windows-cpp-binaries-*/*; do
                cp "$file" dist/
              done
            fi
          fi

          # Python wheels
          if [ "${{ needs.check-tag.outputs.build-python }}" == "true" ]; then
            require_glob "Linux Python x86_64 wheels" artifacts/linux-python-wheels-x86_64/*.whl
            require_glob "Linux Python arm64 wheels" artifacts/linux-python-wheels-arm64/*.whl
            if [ "${{ needs.check-tag.outputs.python-target }}" == "all" ]; then
              require_glob "macOS Python x86_64 wheels" artifacts/macos-python-wheels-x86_64/*.whl
              require_glob "macOS Python arm64 wheels" artifacts/macos-python-wheels-arm64/*.whl
              require_glob "Windows Python x86_64 wheels" artifacts/windows-python-wheels-x86_64/*.whl
              require_glob "Windows Python arm64 wheels" artifacts/windows-python-wheels-arm64/*.whl
            fi
            for wheel in artifacts/linux-python-wheels-*/*.whl artifacts/macos-python-wheels-*/*.whl artifacts/windows-python-wheels-*/*.whl; do
              python3 -c 'import sys, zipfile; p=sys.argv[1]; assert zipfile.is_zipfile(p), f"Invalid wheel ZIP: {p}"; z=zipfile.ZipFile(p); bad=z.testzip(); assert bad is None, f"Corrupt wheel member {bad} in {p}"' "$wheel"
              cp "$wheel" dist/
              cp "$wheel" pypi_dist/
            done
          fi

          # NPM native packages
          if [ "${{ needs.check-tag.outputs.build-npm }}" == "true" ]; then
            require_glob "Linux x64 npm native module" artifacts/npm-linux-x64/avioflow.node
            require_glob "Linux arm64 npm native module" artifacts/npm-linux-arm64/avioflow.node
            require_glob "macOS x64 npm native module" artifacts/npm-darwin-x64/avioflow.node
            require_glob "macOS arm64 npm native module" artifacts/npm-darwin-arm64/avioflow.node
            require_glob "Windows x64 npm native module" artifacts/npm-win32-x64/avioflow.node
            require_glob "Windows arm64 npm native module" artifacts/npm-win32-arm64/avioflow.node
            cp artifacts/npm-linux-x64/avioflow.node nodejs/npm-packages/@lxp3/linux-x64/
            cp artifacts/npm-linux-arm64/avioflow.node nodejs/npm-packages/@lxp3/linux-arm64/
            cp artifacts/npm-darwin-x64/avioflow.node nodejs/npm-packages/@lxp3/darwin-x64/
            cp artifacts/npm-darwin-arm64/avioflow.node nodejs/npm-packages/@lxp3/darwin-arm64/
            cp artifacts/npm-win32-x64/avioflow.node nodejs/npm-packages/@lxp3/win32-x64/
            cp artifacts/npm-win32-arm64/avioflow.node nodejs/npm-packages/@lxp3/win32-arm64/
          fi

          # WASM Engine
          if [ "${{ needs.check-tag.outputs.build-wasm }}" == "true" ]; then
             require_glob "WASM engine" artifacts/wasm-engine/avioflow.wasm
             require_glob "WASM JavaScript loader" artifacts/wasm-engine/avioflow.js
             cp artifacts/wasm-engine/avioflow.wasm dist/
             cp artifacts/wasm-engine/avioflow.js dist/
          fi

          if compgen -G 'dist/*' > /dev/null; then (cd dist && sha256sum * > SHA256SUMS); fi

      # This repository's releases are immutable, so assets cannot be replaced
      # once uploaded. Detect that case and skip the upload rather than failing,
      # which would block the package-registry publish steps below on a re-run.
      - name: Check whether the release already has assets
        id: release-assets
        if: needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-python == 'true' || needs.check-tag.outputs.build-wasm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag-name }}
        run: |
          set -euo pipefail
          # A tag with no release yet makes gh exit nonzero, which set -e and
          # pipefail would turn into a step failure, so absorb that here and
          # treat "no release" as zero assets.
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets | length' 2>/dev/null || true)
          # Guard against a non-numeric or empty result for the same reason.
          case "$COUNT" in
            ''|*[!0-9]*) COUNT=0 ;;
          esac
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::Release $TAG already has $COUNT assets; skipping upload."
          fi

      # Upload to GitHub Release
      - name: Upload to GitHub Release
        if: |
          (needs.check-tag.outputs.build-cpp == 'true' || needs.check-tag.outputs.build-python == 'true' || needs.check-tag.outputs.build-wasm == 'true') &&
          steps.release-assets.outputs.count == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.tag-name }}
          overwrite_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI
      - name: Publish to PyPI
        if: needs.check-tag.outputs.build-python == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi_dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      # Publish the main npm package only. The platform-specific native packages
      # are included in the release artifacts and are not published to npm here.
      - name: Publish avioflow (main package) to NPM
        if: needs.check-tag.outputs.build-npm == 'true'
        working-directory: nodejs
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists. Skipping."
          else
            npm publish --access public --provenance || {
              echo "::warning::Failed to publish $PACKAGE_NAME@$PACKAGE_VERSION to npm. Skipping npm publish."
              exit 0
            }
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A crates.io version is permanent: it can be yanked but never replaced or
      # re-uploaded. So check first and skip rather than fail a re-run, and only
      # publish after `cargo publish --dry-run` has packaged and built the crate.
      - name: Publish avioflow to crates.io
        if: needs.check-tag.outputs.build-rust == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set. Skipping crates.io publish."
            exit 0
          fi

          VERSION=$(tr -d '[:space:]' < version.txt)
          if curl -sSf -H 'User-Agent: avioflow-release' \
               "https://crates.io/api/v1/crates/avioflow/$VERSION" > /dev/null 2>&1; then
            echo "avioflow $VERSION is already on crates.io. Skipping."
            exit 0
          fi

          # Cargo can only publish files inside rust/, so stage the native
          # sources the build script compiles.
          python3 scripts/vendor_rust_sources.py

          # --allow-dirty is required because rust/native/ and rust/LICENSE are
          # generated and gitignored, so vendoring leaves the tree dirty.
          cargo publish --manifest-path rust/Cargo.toml --allow-dirty --dry-run

          if ! cargo publish --manifest-path rust/Cargo.toml --allow-dirty; then
            echo "::error::crates.io publish failed. If the message mentions a"\
                 "verified email address, add and confirm one at"\
                 "https://crates.io/settings/profile, then re-run this job."
            exit 1
          fi

      # Go has no registry: the module proxy reads git tags directly. A module in
      # a subdirectory needs a tag prefixed with that directory, so the plain
      # v0.7.3 tag is invisible to `go get github.com/lxp3/avioflow/go` -- it
      # looks for go/v0.7.3. Push that alias so the Go module tracks the release.
      - name: Tag the Go module
        if: needs.check-tag.outputs.build-go == 'true'
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < version.txt)
          GO_TAG="go/v$VERSION"

          # Tags are effectively immutable once the proxy caches them, so never
          # move an existing one; skip instead, which keeps a re-run safe.
          if git ls-remote --exit-code --tags origin "refs/tags/$GO_TAG" >/dev/null 2>&1; then
            echo "$GO_TAG already exists. Skipping."
            exit 0
          fi

          git tag "$GO_TAG" "$GITHUB_SHA"
          git push origin "$GO_TAG"
          echo "::notice::Tagged $GO_TAG; go get github.com/lxp3/avioflow/go@v$VERSION"
