name: Release Node.js

on:
  workflow_call:
    inputs:
      build-npm:
        required: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build-linux-npm-x64:
    if: inputs.build-npm
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Install Node.js 20
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs

      - name: Build Node.js Addon
        run: |
          set -e
          (cd nodejs && npm ci)
          # cmake-js reads configuration from package.json in the current directory
          ln -sf nodejs/package.json package.json
          export PATH="$(pwd)/nodejs/node_modules/.bin:$PATH"
          cmake-js compile --out build-nodejs \
            --CDENABLE_NODE_JS=ON \
            --CDENABLE_PYTHON=OFF \
            --CDENABLE_BINARY=OFF \
            --CDENABLE_WASAPI=OFF
          rm -f package.json
          cp build-nodejs/bin/avioflow.node nodejs/npm-packages/@lxp3/linux-x64/avioflow.node
          scripts/check_glibc_version.sh nodejs/npm-packages/@lxp3/linux-x64/avioflow.node

      - name: Verify Node.js Addon
        working-directory: nodejs
        run: |
          export AVIOFLOW_BINDINGS_PATH="$(pwd)/npm-packages/@lxp3/linux-x64/avioflow.node"
          node tests/test-offline-load.js
          node tests/test-resample.js

      - uses: actions/upload-artifact@v4
        with:
          name: npm-linux-x64
          path: nodejs/npm-packages/@lxp3/linux-x64/

  build-linux-npm-arm64:
    if: inputs.build-npm
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build in manylinux_2_28 container
        run: |
          docker run --rm \
            -v $(pwd):/io -w /io \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -c "
              set -e && \
              curl -fsSL https://rpm.nodesource.com/setup_20.x | bash - && \
              dnf install -y nodejs && \
              (cd nodejs && npm ci) && \
              ln -sf nodejs/package.json package.json && \
              export PATH=\"\$(pwd)/nodejs/node_modules/.bin:\$PATH\" && \
              cmake-js compile --out build-nodejs \
                --CDENABLE_NODE_JS=ON \
                --CDENABLE_PYTHON=OFF \
                --CDENABLE_BINARY=OFF \
                --CDENABLE_WASAPI=OFF && \
              rm -f package.json && \
              cp build-nodejs/bin/avioflow.node nodejs/npm-packages/@lxp3/linux-arm64/avioflow.node && \
              scripts/check_glibc_version.sh nodejs/npm-packages/@lxp3/linux-arm64/avioflow.node
            "

      - name: Verify Node.js Addon
        run: |
          docker run --rm \
            -v $(pwd):/io -w /io/nodejs \
            quay.io/pypa/manylinux_2_28_aarch64 \
            bash -c "
              curl -fsSL https://rpm.nodesource.com/setup_20.x | bash - && \
              dnf install -y nodejs && \
              export AVIOFLOW_BINDINGS_PATH=\"\$(pwd)/npm-packages/@lxp3/linux-arm64/avioflow.node\" && \
              node tests/test-offline-load.js
          node tests/test-resample.js
            "

      - uses: actions/upload-artifact@v4
        with:
          name: npm-linux-arm64
          path: nodejs/npm-packages/@lxp3/linux-arm64/

  build-macos-npm-x64:
    if: inputs.build-npm
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Node.js Addon
        run: |
          set -e
          (cd nodejs && npm ci)
          # cmake-js reads configuration from package.json in the current directory
          ln -sf nodejs/package.json package.json
          export PATH="$(pwd)/nodejs/node_modules/.bin:$PATH"
          cmake-js compile --out build-nodejs \
            --CDENABLE_NODE_JS=ON \
            --CDENABLE_PYTHON=OFF \
            --CDENABLE_BINARY=OFF \
            --CDENABLE_WASAPI=OFF
          rm -f package.json
          cp build-nodejs/bin/avioflow.node nodejs/npm-packages/@lxp3/darwin-x64/avioflow.node

      - name: Verify Node.js Addon
        working-directory: nodejs
        run: |
          export AVIOFLOW_BINDINGS_PATH="$(pwd)/npm-packages/@lxp3/darwin-x64/avioflow.node"
          node tests/test-offline-load.js
          node tests/test-resample.js

      - uses: actions/upload-artifact@v4
        with:
          name: npm-darwin-x64
          path: nodejs/npm-packages/@lxp3/darwin-x64/

  build-macos-npm-arm64:
    if: inputs.build-npm
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Node.js Addon
        run: |
          set -e
          (cd nodejs && npm ci)
          # cmake-js reads configuration from package.json in the current directory
          ln -sf nodejs/package.json package.json
          export PATH="$(pwd)/nodejs/node_modules/.bin:$PATH"
          cmake-js compile --out build-nodejs \
            --CDENABLE_NODE_JS=ON \
            --CDENABLE_PYTHON=OFF \
            --CDENABLE_BINARY=OFF \
            --CDENABLE_WASAPI=OFF
          rm -f package.json
          cp build-nodejs/bin/avioflow.node nodejs/npm-packages/@lxp3/darwin-arm64/avioflow.node

      - name: Verify Node.js Addon
        working-directory: nodejs
        run: |
          export AVIOFLOW_BINDINGS_PATH="$(pwd)/npm-packages/@lxp3/darwin-arm64/avioflow.node"
          node tests/test-offline-load.js
          node tests/test-resample.js

      - uses: actions/upload-artifact@v4
        with:
          name: npm-darwin-arm64
          path: nodejs/npm-packages/@lxp3/darwin-arm64/
