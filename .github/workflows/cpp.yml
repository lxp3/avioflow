name: Release C++

on:
  workflow_call:
    inputs:
      build-cpp:
        required: true
        type: boolean
      cpp-target:
        required: false
        type: string
        default: all

permissions:
  contents: read
  actions: write

jobs:
  build-linux-cpp:
    if: inputs.build-cpp && (inputs.cpp-target == 'all' || inputs.cpp-target == 'linux')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            docker-image: quay.io/pypa/manylinux_2_28_x86_64
            shared-libs: "ON"
            package-kind: shared
            cxx11-abi: "1"
            pkg-dir: avioflow-shared-linux-x64-abi1
            artifact-name: linux-cpp-binaries-shared-x86_64-abi1
          - arch: x86_64
            runner: ubuntu-latest
            docker-image: quay.io/pypa/manylinux_2_28_x86_64
            shared-libs: "ON"
            package-kind: shared
            cxx11-abi: "0"
            pkg-dir: avioflow-shared-linux-x64-abi0
            artifact-name: linux-cpp-binaries-shared-x86_64-abi0
          - arch: x86_64
            runner: ubuntu-latest
            docker-image: quay.io/pypa/manylinux_2_28_x86_64
            shared-libs: "OFF"
            package-kind: static
            cxx11-abi: "1"
            pkg-dir: avioflow-static-linux-x64-abi1
            artifact-name: linux-cpp-binaries-static-x86_64-abi1
          - arch: x86_64
            runner: ubuntu-latest
            docker-image: quay.io/pypa/manylinux_2_28_x86_64
            shared-libs: "OFF"
            package-kind: static
            cxx11-abi: "0"
            pkg-dir: avioflow-static-linux-x64-abi0
            artifact-name: linux-cpp-binaries-static-x86_64-abi0
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker-image: quay.io/pypa/manylinux_2_28_aarch64
            shared-libs: "ON"
            package-kind: shared
            cxx11-abi: "1"
            pkg-dir: avioflow-shared-linux-arm64-abi1
            artifact-name: linux-cpp-binaries-shared-aarch64-abi1
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker-image: quay.io/pypa/manylinux_2_28_aarch64
            shared-libs: "ON"
            package-kind: shared
            cxx11-abi: "0"
            pkg-dir: avioflow-shared-linux-arm64-abi0
            artifact-name: linux-cpp-binaries-shared-aarch64-abi0
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker-image: quay.io/pypa/manylinux_2_28_aarch64
            shared-libs: "OFF"
            package-kind: static
            cxx11-abi: "1"
            pkg-dir: avioflow-static-linux-arm64-abi1
            artifact-name: linux-cpp-binaries-static-aarch64-abi1
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker-image: quay.io/pypa/manylinux_2_28_aarch64
            shared-libs: "OFF"
            package-kind: static
            cxx11-abi: "0"
            pkg-dir: avioflow-static-linux-arm64-abi0
            artifact-name: linux-cpp-binaries-static-aarch64-abi0
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build C++ ${{ matrix.package-kind }} binaries in manylinux_2_28 (${{ matrix.arch }}, ABI ${{ matrix.cxx11-abi }})
        run: |
          docker run --rm -v $(pwd):/io -w /io ${{ matrix.docker-image }} bash -c "
            printf '%s\n' \
              '#include <string>' \
              '#ifndef _GLIBCXX_USE_CXX11_ABI' \
              '#error _GLIBCXX_USE_CXX11_ABI is not defined' \
              '#endif' \
              'std::string make_value() { return \"avioflow\"; }' \
              'int main() {' \
              '    static_assert(_GLIBCXX_USE_CXX11_ABI == EXPECTED_ABI, \"Unexpected libstdc++ ABI\");' \
              '    std::string value = make_value();' \
              '    return value.empty();' \
              '}' \
              > /tmp/avioflow_abi_check.cpp && \
            \${CXX:-c++} -DEXPECTED_ABI=${{ matrix.cxx11-abi }} -D_GLIBCXX_USE_CXX11_ABI=${{ matrix.cxx11-abi }} /tmp/avioflow_abi_check.cpp -o /tmp/avioflow_abi_check && \
            if [ \"${{ matrix.cxx11-abi }}\" = \"1\" ]; then \
              nm -C /tmp/avioflow_abi_check | grep 'std::__cxx11::basic_string'; \
            else \
              ! nm -C /tmp/avioflow_abi_check | grep 'std::__cxx11::basic_string'; \
            fi && \
            /tmp/avioflow_abi_check && \
            cmake -B build_${{ matrix.package-kind }}_abi${{ matrix.cxx11-abi }} -DCMAKE_BUILD_TYPE=Release -DAVIOFLOW_GLIBCXX_USE_CXX11_ABI=${{ matrix.cxx11-abi }} -DBUILD_SHARED_LIBS=${{ matrix.shared-libs }} -DBUILD_TESTING=ON -DENABLE_WASAPI=OFF -DENABLE_PYTHON=OFF -DENABLE_NODE_JS=OFF -DENABLE_BINARY=ON && \
            cmake --build build_${{ matrix.package-kind }}_abi${{ matrix.cxx11-abi }} --config Release -j \$(nproc) && \
            ctest --test-dir build_${{ matrix.package-kind }}_abi${{ matrix.cxx11-abi }} --output-on-failure && \
            LIB=\$(find build_${{ matrix.package-kind }}_abi${{ matrix.cxx11-abi }} -type f \( -name 'libavioflow.so*' -o -name 'libavioflow.a' \) | head -n1) && \
            test -n \"\$LIB\" && \
            if [ \"${{ matrix.package-kind }}\" = static ]; then if [ \"${{ matrix.cxx11-abi }}\" = 1 ]; then nm -C \"\$LIB\" | grep -q 'std::__cxx11'; else ! nm -C \"\$LIB\" | grep 'std::__cxx11'; fi; fi && \
            if [ \"${{ matrix.package-kind }}\" = shared ]; then scripts/check_glibc_version.sh \"\$LIB\"; fi && \
            PKG_DIR=\"${{ matrix.pkg-dir }}\" && \
            cmake --install build_${{ matrix.package-kind }}_abi${{ matrix.cxx11-abi }} --prefix \$PKG_DIR && \
            SMOKE_DIR=\"/tmp/avioflow-smoke-${{ matrix.package-kind }}-abi${{ matrix.cxx11-abi }}\" && \
            rm -rf \"\$SMOKE_DIR\" && \
            mkdir -p \"\$SMOKE_DIR\" && \
            printf '%s\n' \
              'cmake_minimum_required(VERSION 3.20)' \
              'project(avioflow_consumer LANGUAGES CXX)' \
              'find_package(avioflow CONFIG REQUIRED)' \
              'add_executable(avioflow_smoke main.cpp)' \
              'target_link_libraries(avioflow_smoke PRIVATE avioflow::avioflow)' \
              > \"\$SMOKE_DIR/CMakeLists.txt\" && \
            printf '%s\n' \
              '#include \"avioflow-cxx-api.h\"' \
              'int main() {' \
              '    avioflow::AudioDecoder decoder;' \
              '    decoder.load_file(\"/io/public/wavs/TownTheme.mp3\");' \
              '    return decoder.get_samples().empty();' \
              '}' \
              > \"\$SMOKE_DIR/main.cpp\" && \
            cmake -S \"\$SMOKE_DIR\" -B \"\$SMOKE_DIR/build\" -Davioflow_DIR=\"\$(pwd)/\$PKG_DIR/lib/cmake/avioflow\" && \
            cmake --build \"\$SMOKE_DIR/build\" --config Release -j \$(nproc) && \
            LD_LIBRARY_PATH=\"\$(pwd)/\$PKG_DIR/lib:\${LD_LIBRARY_PATH:-}\" \"\$SMOKE_DIR/build/avioflow_smoke\" && \
            ! find \"\$PKG_DIR\" \( -name .smoke -o -name CMakeCache.txt -o -name CMakeLists.txt -o -name main.cpp \) | grep . && \
            tar -czvf \$PKG_DIR.tar.gz \$PKG_DIR
          "

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.pkg-dir }}.tar.gz


  build-macos-cpp:
    if: inputs.build-cpp && inputs.cpp-target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            shared-libs: "ON"
            package-kind: shared
            pkg-dir: avioflow-shared-macos-x64
            artifact-name: macos-cpp-binaries-shared-x86_64
          - arch: x86_64
            runner: macos-15-intel
            shared-libs: "OFF"
            package-kind: static
            pkg-dir: avioflow-static-macos-x64
            artifact-name: macos-cpp-binaries-static-x86_64
          - arch: aarch64
            runner: macos-15
            shared-libs: "ON"
            package-kind: shared
            pkg-dir: avioflow-shared-macos-arm64
            artifact-name: macos-cpp-binaries-shared-aarch64
          - arch: aarch64
            runner: macos-15
            shared-libs: "OFF"
            package-kind: static
            pkg-dir: avioflow-static-macos-arm64
            artifact-name: macos-cpp-binaries-static-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version metadata
        run: python3 scripts/sync_version.py

      - name: Build macOS C++ ${{ matrix.package-kind }} (${{ matrix.arch }})
        run: |
          cmake -B build_macos_${{ matrix.package-kind }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DBUILD_SHARED_LIBS=${{ matrix.shared-libs }} \
            -DENABLE_WASAPI=OFF \
            -DENABLE_PYTHON=OFF \
            -DENABLE_NODE_JS=OFF \
            -DENABLE_BINARY=ON
          cmake --build build_macos_${{ matrix.package-kind }} --config Release -j "$(sysctl -n hw.logicalcpu)"
          cmake --install build_macos_${{ matrix.package-kind }} --prefix "${{ matrix.pkg-dir }}" --config Release
          if [ "${{ matrix.package-kind }}" = "shared" ]; then
            for dylib in "${{ matrix.pkg-dir }}"/lib/*.dylib; do
              [ -e "$dylib" ] || continue
              install_name_tool -id "@rpath/$(basename "$dylib")" "$dylib" || true
            done
            for target in "${{ matrix.pkg-dir }}"/lib/*.dylib "${{ matrix.pkg-dir }}"/bin/*; do
              [ -e "$target" ] || continue
              otool -L "$target" 2>/dev/null | awk '/lib(av|sw).*\.dylib/{print $1}' | while read -r dep; do
                install_name_tool -change "$dep" "@rpath/$(basename "$dep")" "$target" || true
              done
            done
          fi
          tar -czvf "${{ matrix.pkg-dir }}.tar.gz" "${{ matrix.pkg-dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.pkg-dir }}.tar.gz
